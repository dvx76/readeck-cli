[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readeck-cli"
version = "0.1.0"
description = "Read-only CLI for a self-hosted Readeck instance, designed for agents"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["readeck", "read-it-later", "cli", "agents", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
readeck = "readeck_cli.cli:main"
readeck-cli = "readeck_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readeck_cli"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
